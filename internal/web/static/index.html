<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tunnel Manager</title>
    <!-- The paths are absolute because this page is also what /ui/<anything>
         is answered with, and a relative path would be resolved against that
         path instead of against /ui/. -->
    <link rel="stylesheet" href="/ui/style.css" />
    <!-- The theme is put on <html> here, in the head, and not by app.js at the
         end of the body: the body has not been parsed yet, so nothing has been
         painted and a dark page is never shown light first. The key and the two
         names are the ones app.js reads and writes.

         Dark is what a first visit gets, whatever the browser is set to. This
         page is a console that is left open beside other work, and the dark one
         is the side it was drawn for; what the browser prefers is a guess about
         every page, and this is not every page.

         Reading the storage is what a browser with it turned off throws on, so
         the read is guarded and a throw leaves the choice to the default. -->
    <script>
      (function () {
        var picked = null;

        try {
          picked = window.localStorage.getItem("tm_theme");
        } catch (error) {
          picked = null;
        }

        if (picked !== "light" && picked !== "dark") {
          picked = "dark";
        }

        document.documentElement.setAttribute("data-theme", picked);
      })();
    </script>
    <!-- The language is settled here for the reason the theme is: lang and dir
         are on <html>, and a page that took them after the body was parsed
         would lay the first paint out left to right and turn it round
         afterwards. The list of codes and the one that is written right to left
         are the same ones app.js holds, and a test compares the two lists, so a
         language added to one file and not the other fails the build rather
         than the page.

         The two catalogs are asked for here as well, while the head is still
         being parsed, so they travel alongside screens.js and app.js instead of
         after them. app.js waits on what is left of them and draws the first
         screen in the right words. English is always one of the two because it
         is what a key the chosen language is missing falls back to. -->
    <script>
      (function () {
        var codes = ["en", "ko", "ja", "zh", "es", "fr", "de", "pt-BR", "ru", "ar", "hi", "vi", "th"];
        var rightToLeft = ["ar"];
        var picked = null;

        try {
          picked = window.localStorage.getItem("tm_lang");
        } catch (error) {
          picked = null;
        }

        if (codes.indexOf(picked) < 0) {
          picked = fromBrowser();
        }

        document.documentElement.setAttribute("lang", picked);
        document.documentElement.setAttribute("dir", rightToLeft.indexOf(picked) < 0 ? "ltr" : "rtl");

        window.tmBoot = { lang: picked, base: catalog("en"), text: null };
        window.tmBoot.text = picked === "en" ? window.tmBoot.base : catalog(picked);

        // fromBrowser is the first language the browser asks for that there is
        // a catalog for. A tag is taken whole first and by its language alone
        // after, so that a browser set to pt-PT is answered in Portuguese
        // rather than in English, and one set to pt-BR is not answered by
        // whatever Portuguese happens to be first in the list.
        function fromBrowser() {
          var wanted = window.navigator.languages;
          if (wanted === undefined || wanted === null || wanted.length === 0) {
            wanted = window.navigator.language === undefined ? [] : [window.navigator.language];
          }

          for (var i = 0; i < wanted.length; i++) {
            var tag = String(wanted[i]).toLowerCase();

            for (var j = 0; j < codes.length; j++) {
              if (codes[j].toLowerCase() === tag) {
                return codes[j];
              }
            }

            for (var k = 0; k < codes.length; k++) {
              if (codes[k].toLowerCase().split("-")[0] === tag.split("-")[0]) {
                return codes[k];
              }
            }
          }

          return "en";
        }

        // catalog starts one file on its way. A failure is answered with null
        // and not with a throw: app.js has to draw the screens either way, and
        // what a missing catalog costs is the words on a handful of controls,
        // not the page.
        function catalog(code) {
          return window.fetch("/ui/lang/" + code + ".json", {
            headers: { Accept: "application/json" },
            credentials: "same-origin"
          }).then(function (response) {
            return response.ok ? response.json() : null;
          }).catch(function () {
            return null;
          });
        }
      })();
    </script>
  </head>
  <body>
    <!-- The version sits outside #app because that element is emptied on every
         draw. Kept inside it the number would be wiped by the first screen and
         would have to be fetched again for each one. -->
    <div id="versionTag"></div>
    <!-- The two switches that belong to the browser rather than to the screen.
         They are outside #app because that element is emptied on every draw,
         and they are in one box so that the two sit next to each other at one
         end of the top row without either being told in pixels where the other
         ends.

         Neither carries a label until app.js has put one on it: the words on
         them come from a catalog that is still on its way, and a switch that
         showed English for a moment on a page asked for in Korean is the flip
         this whole arrangement is here to avoid. -->
    <div id="cornerControls">
      <select id="langPick" hidden></select>
      <!-- The switch is a button that holds its own parts: the track, the knob
           that slides and turns from a sun into a crescent moon, and the stars
           that come out behind it. There are no words on it: what it is in is
           said by the shape and by aria-pressed, and a word beside a drawing
           this plain is a second thing to read where one was enough. They
           are here rather than built in app.js so the shape is painted with the
           first frame, in the theme the script above already settled, and the
           only thing left for the script is what a press does.

           aria-pressed says which of the two it is in, so a reader that cannot
           see a moon slide is told the state and not only the label. -->
      <button id="themeToggle" type="button" role="switch" aria-pressed="false" hidden>
        <span class="theme-track">
          <span class="theme-knob"></span>
        </span>
      </button>
    </div>
    <!-- The ellipsis is not a word on purpose. It is painted before any script
         has run, so there is no catalog to take a word from, and "Loading..."
         would be the one English string a page asked for in another language
         starts with. -->
    <div id="app">&#8230;</div>
    <!-- screens.js is loaded first: it holds the table of screens that app.js
         reads as soon as it runs, to draw the screen the URL asks for. -->
    <script src="/ui/screens.js"></script>
    <script src="/ui/app.js"></script>
  </body>
</html>
