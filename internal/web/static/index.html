<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tunnel Manager</title>
    <!-- The paths are absolute because this page is also what /ui/<anything>
         is answered with, and a relative path would be resolved against that
         path instead of against /ui/. -->
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <!-- The version sits outside #app because that element is emptied on every
         draw. Kept inside it the number would be wiped by the first screen and
         would have to be fetched again for each one. -->
    <div id="versionTag"></div>
    <div id="app">Loading...</div>
    <!-- screens.js is loaded first: it holds the table of screens that app.js
         reads as soon as it runs, to draw the screen the URL asks for. -->
    <script src="/ui/screens.js"></script>
    <script src="/ui/app.js"></script>
  </body>
</html>
