name: Image

# A tag is what an image is built from, so that what is pulled is a release and
# not whatever master happened to be at the time. The manual trigger is there
# for rebuilding one that failed to push without moving the tag to do it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    # Pushing to ghcr.io is the one write this workflow makes, and it is given
    # to the job that pushes rather than to the workflow, so that a job added
    # here later starts from read-only.
    permissions:
      contents: read
      packages: write
    steps:
    # Nothing here pushes to the repository; the registry login below takes the
    # token on its own. Leaving it in .git/config would only hand it to every
    # later step, the build context included.
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    # The program is cross-compiled by the builder stage, but the stage the
    # image is made of runs apk on the platform it is for, and that one needs
    # emulating when it is not the runner's own.
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The tag without its leading v, which is what the version inside the
    # program says and what the release notes call it.
    - name: Read the version out of the tag
      id: version
      run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    # The two platforms the release builds a binary for. The other three a
    # release ships are not platforms a container runs on.
    #
    # The version reaches the script through the environment and not written
    # into it. It is cut from a tag name, and a tag name expanded into the
    # script text is script text: whoever can push a tag could put a command
    # in it. The repository name is read from GITHUB_REPOSITORY, which the
    # runner sets, for the same reason.
    - name: Build and push
      env:
        VERSION: ${{ steps.version.outputs.value }}
      run: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" \
          --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
          --push \
          .

    # What was pushed, said in the log, so that a run that went green can be
    # read back for which tags it put up.
    - name: Say what went up
      env:
        VERSION: ${{ steps.version.outputs.value }}
      run: |
        echo "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
        echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
