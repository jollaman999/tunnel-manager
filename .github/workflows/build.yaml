name: Go

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - ".dockerignore"
      - ".gitignore"
      - "docker-compose.yaml"
      - "Dockerfile"
      - "LICENSE"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    # The version comes from go.mod, from its toolchain line, so the Go this
    # builds with is the one the module names rather than a second copy of the
    # number that has to be moved by hand when go.mod moves.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build
      run: make

    # The description of the API and the copy of Swagger UI that reads it are
    # generated, committed, and easy to forget to regenerate. This runs the
    # generators and fails if either moved, so a handler that changed shape
    # without the description following it is caught here rather than by
    # whoever reads the documentation next.
    - name: Check the generated documentation
      run: make docs-check

    - name: Vet
      run: go vet ./...

    - name: Check gofmt
      run: |
        dirs=$(go list -f '{{.Dir}}' ./...)
        unformatted=$(find $dirs -maxdepth 1 -name '*.go' -exec gofmt -l {} +)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on the following files:"
          echo "$unformatted"
          exit 1
        fi

    - name: Test
      run: go test ./... -count=1 -race -timeout 20m
