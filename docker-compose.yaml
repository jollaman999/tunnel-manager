services:
  tunnel-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tunnel-manager
    image: tunnel-manager:2.1.0
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "8888:8888"
    # The database file is the whole of the installation state, and everything
    # else this installation owns sits beside it: the encryption key, the log
    # and the initial password are all read against the directory the database
    # is in. One mount on that directory therefore carries all of it, and there
    # is nothing left to mount separately.
    #
    # The key is what the stored SSH passwords are sealed with. One that stayed
    # inside the container would be gone with the next build, and every stored
    # password with it. A path set on the Settings screen has to stay under a
    # mounted directory for the same reason.
    volumes:
      - ./_data:/data
    environment:
      - TZ=Asia/Seoul
    restart: always
    networks:
      - tunnel-network

networks:
  tunnel-network:
    driver: bridge
