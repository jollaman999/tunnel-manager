services:
  tunnel-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tunnel-manager
    image: tunnel-manager:2.1.0
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "8888:8888"
    working_dir: /
    # The database file is the whole of the installation state, so the
    # directory it lives in is what has to outlive the container. /data is
    # where the image puts it (Dockerfile, CMD), and the settings, the hosts
    # and the account are all in that one file now.
    #
    # /keys is the other half: security.key_file defaults to
    # keys/tunnel-manager.key, which is read against working_dir and so lands
    # there. That key is what the stored SSH passwords are sealed with, and one
    # that stayed inside the container would be gone with the next build, which
    # leaves every stored password unreadable. The setting is changed on the
    # Settings screen; a path set there has to stay under a mounted directory.
    volumes:
      - ./_data/db:/data
      - ./_data/keys:/keys
      - ./_data/logs:/logs
    environment:
      - TZ=Asia/Seoul
    restart: always
    networks:
      - tunnel-network

networks:
  tunnel-network:
    driver: bridge
