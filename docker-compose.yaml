services:
  tunnel-manager:
    # The image a release tag builds and pushes, for whichever of linux/amd64
    # and linux/arm64 this machine runs. latest is the newest release; write a
    # version here instead to stay on one. Nothing is built from this file, so
    # that what runs is the released image rather than whatever the working
    # tree happens to hold. To run an unreleased change, build the Dockerfile
    # by hand and put the name it was tagged with here.
    image: ghcr.io/jollaman999/tunnel-manager:latest
    container_name: tunnel-manager
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "8888:8888"
    # The database file is the whole of the installation state, and everything
    # else this installation owns sits beside it: the encryption key, the log
    # and the initial password are all read against the directory the database
    # is in. One mount on that directory therefore carries all of it, and there
    # is nothing left to mount separately.
    #
    # The key is what the stored SSH passwords are sealed with. One that stayed
    # inside the container would be gone with the next build, and every stored
    # password with it. A path set on the Settings screen has to stay under a
    # mounted directory for the same reason.
    volumes:
      - ./_data:/data
    environment:
      - TZ=Asia/Seoul
    restart: always
    networks:
      - tunnel-network

networks:
  tunnel-network:
    driver: bridge
